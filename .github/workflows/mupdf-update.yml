name: MuPDF release check

# Watches https://mupdf.com/releases/history and https://mupdf.com/security and
# opens an issue when Artifex publishes something newer than the pin in
# third_party/mupdf/CMakeLists.txt.
#
# It never downloads a tarball and never edits the pin. Moving to a new MuPDF
# changes which AGPL-3.0 code is compiled into every consumer's app, can remove
# API the engine calls (1.28.4 has no FZ_ERROR_MEMORY; earlier versions had no
# fz_convert_error), and has to be re-measured against the fixtures and the
# native gates before it is believed. So the automation's whole job is to say
# "a newer release exists", and a person does the version+hash bump described in
# docs/mupdf-update.md.

on:
  schedule:
    # Mondays, 07:00 UTC. Artifex ships point releases irregularly; weekly is
    # often enough to notice and rare enough not to become noise.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check for a newer MuPDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No npm install: the checker uses only node: builtins and global fetch.
      - id: check
        name: Compare the pin against upstream
        run: node scripts/check-mupdf-release.mjs | tee "$RUNNER_TEMP/mupdf-check.json"

      - uses: actions/upload-artifact@v4
        with:
          name: mupdf-release-check
          path: ${{ runner.temp }}/mupdf-check.json
          if-no-files-found: error

      - name: Up to date
        if: steps.check.outputs.action_needed != 'true'
        run: |
          echo "Pinned MuPDF ${{ steps.check.outputs.pinned_version }} is the latest release." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: steps.check.outputs.action_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.check.outputs.pinned_version }}
          LATEST: ${{ steps.check.outputs.latest_version }}
          NEWER: ${{ steps.check.outputs.newer_versions }}
          SECURITY_CHANGED: ${{ steps.check.outputs.security_changed }}
          SECURITY_DIGEST: ${{ steps.check.outputs.security_digest }}
          CVES: ${{ steps.check.outputs.cves }}
        run: |
          # Two conditions can fire this step and they need different titles.
          # A security-page change with no new release must not produce
          # "MuPDF 1.28.4 is newer than the pinned 1.28.4". The digest is in the
          # security title so the same change is not filed twice and a later one
          # gets its own issue.
          if [ -n "$NEWER" ]; then
            TITLE="MuPDF $LATEST is newer than the pinned $PINNED"
          else
            TITLE="MuPDF security page changed (${SECURITY_DIGEST:0:12})"
          fi

          # Upsert rather than create, so a label that already exists is not an
          # error and a renamed colour does not need a manual fix.
          gh label create mupdf-update \
            --description "MuPDF version pin needs review" \
            --color B60205 --force

          EXISTING=$(gh issue list --label mupdf-update --state open \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          {
            echo "\`third_party/mupdf/CMakeLists.txt\` pins MuPDF **$PINNED**."
            if [ -n "$NEWER" ]; then
              echo "Upstream's release history now lists **$LATEST**."
            else
              echo "No newer release, but <https://mupdf.com/security> has changed"
              echo "since \`.github/mupdf-security-baseline.txt\` was recorded."
              echo "Read the page, then update that file in the same commit that"
              echo "resolves this issue."
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Pinned | \`$PINNED\` |"
            echo "| Latest | \`$LATEST\` |"
            echo "| Newer releases | $NEWER |"
            echo "| Security page changed | $SECURITY_CHANGED |"
            echo "| Security page digest | \`$SECURITY_DIGEST\` |"
            echo "| CVEs named on that page | ${CVES:-none} |"
            echo
            echo "Sources: <https://mupdf.com/releases/history>, <https://mupdf.com/security>"
            echo
            echo "## This is not an automatic upgrade"
            echo
            echo "Nothing has been downloaded and nothing has been bumped. MuPDF is"
            echo "AGPL-3.0 / Artifex commercial and is linked into every consumer's"
            echo "app, and a release can remove API the engine calls. The update is a"
            echo "reviewed version + SHA256 bump that reruns the fixtures and the"
            echo "native gates."
            echo
            echo "## Procedure"
            echo
            echo "Full version in [\`docs/mupdf-update.md\`](../blob/HEAD/docs/mupdf-update.md)."
            echo
            echo "- [ ] Read \`CHANGES\` in the new tarball for removed or renamed API"
            echo "- [ ] Bump \`MUPDF_VERSION\`, \`MUPDF_URL_SHA256\` and \`MUPDF_UPSTREAM_TAG\`"
            echo "- [ ] Re-run \`third_party/mupdf/extract_sources.py\` and review the \`mupdf_sources.cmake\` diff"
            echo "- [ ] \`npm run test:mupdf\` green against the real fixtures"
            echo "- [ ] Android \`assembleRelease\` green, \`scripts/check-android-aar.sh\` green, \`.so\` size recorded"
            echo "- [ ] iOS \`scripts/build-mupdf-apple.sh\` green, both slices present"
            echo "- [ ] \`docs/licensing.md\` version, date, SHA256 and tag updated"
            echo "- [ ] \`docs/mupdf-integration-status.md\` re-measured, not copied forward"
          } > "$RUNNER_TEMP/issue.md"

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --label mupdf-update \
              --body-file "$RUNNER_TEMP/issue.md"
          fi

          cat "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"
